services:
  postgres:
    image: postgres:16-alpine
    container_name: citibike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citibike}
      POSTGRES_USER: ${POSTGRES_USER:-citibike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citibike} -d ${POSTGRES_DB:-citibike}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - citibike-network

volumes:
  postgres_data:

networks:
  citibike-network:
    name: citibike-network
