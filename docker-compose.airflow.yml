x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  restart: unless-stopped
  working_dir: /opt/citibike
  environment: &airflow-common-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/citibike/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-HE2jewjKhsD5igOPL4Pd7bsQFRWW0CJNBX3rv_4Fz9c=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-citibike-airflow-local-jwt-secret}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    DATABASE_URL: postgresql+psycopg://citibike:${POSTGRES_PASSWORD:-citibike}@postgres:5432/${POSTGRES_DB:-citibike}
    PIPELINE_CONFIG: /opt/citibike/config/config.yaml
    CITIBIKE_PROJECT_ROOT: /opt/citibike
    NYC_OPEN_DATA_APP_TOKEN: ${NYC_OPEN_DATA_APP_TOKEN:-}
  volumes:
    - airflow_home:/opt/airflow
  networks:
    - citibike-network

services:
  airflow-db:
    image: postgres:16-alpine
    container_name: citibike-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      TZ: UTC
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - citibike-network

  airflow-init:
    <<: *airflow-common
    container_name: citibike-airflow-init
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["db", "migrate"]

  airflow-api-server:
    <<: *airflow-common
    container_name: citibike-airflow-api
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["api-server", "--port", "8080"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: citibike-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    container_name: citibike-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["dag-processor"]

  airflow-triggerer:
    <<: *airflow-common
    container_name: citibike-airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started
    command: ["triggerer"]

volumes:
  airflow_db_data:
  airflow_home:
