name: CI

on:
  push:
    branches:
      - main
      - full-pas-project
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,transform,ml]"

      - name: Проверка Ruff
        run: python -m ruff check src tests

      - name: Автоматические тесты
        run: python -m pytest

      - name: Проверка синтаксиса служебного кода
        run: |
          python -m compileall -q src
          python -m compileall -q airflow/dags
          python -m compileall -q superset

      - name: Проверка Docker Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.airflow.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.superset.yml config -q
