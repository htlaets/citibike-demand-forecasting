[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citibike-demand-forecasting"
version = "0.4.0"
description = "Forecast-analytics data platform for NYC Citi Bike demand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
transform = [
  "dbt-postgres>=1.8,<2",
]
ml = [
  "numpy>=1.26,<3",
  "catboost>=1.2.10,<2",
]

[project.scripts]
citibike-pipeline = "citibike_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
