project:
  name: citibike-demand-forecasting
  timezone: America/New_York
  raw_data_dir: data/raw
  quarantine_data_dir: data/quarantine
  artifacts_dir: artifacts

database:
  url_env: DATABASE_URL
  connect_timeout_seconds: 10

http:
  timeout_seconds: 30
  connect_timeout_seconds: 15
  read_timeout_seconds: 30
  download_read_timeout_seconds: 300
  retries: 4
  backoff_factor: 1.0
  user_agent: citibike-demand-forecasting/1.0

sources:
  citibike_trips:
    base_url: https://s3.amazonaws.com/tripdata
    source_type: zip_csv
    incremental_unit: month
    chunk_size: 20000

  citibike_gbfs:
    discovery_url: https://gbfs.citibikenyc.com/gbfs/gbfs.json
    source_type: rest_json
    feeds:
      - station_information
      - station_status

  weather:
    historical_url: https://archive-api.open-meteo.com/v1/archive
    forecast_url: https://api.open-meteo.com/v1/forecast
    source_type: rest_json
    latitude: 40.7128
    longitude: -74.0060
    timezone: America/New_York
    hourly:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - rain
      - snowfall
      - weather_code
      - wind_speed_10m

  traffic:
    url: https://data.cityofnewyork.us/resource/i4gi-tjb9.json
    source_type: socrata_json
    page_size: 5000
    max_pages_per_run: 100
    bootstrap_since_hours: 24

quality:
  # Freshness thresholds reflect source publication cadence, not one universal SLA.
  freshness_hours:
    citibike_trips: 1488
    citibike_gbfs: 2
    weather: 72
    traffic: 12
  station_latitude_range: [40.0, 42.0]
  station_longitude_range: [-75.0, -72.0]
